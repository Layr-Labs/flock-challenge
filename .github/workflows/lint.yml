# Formatting, Clippy and repository static checks for solver pull requests.
#
# Everything here runs on GitHub-hosted runners. None of these checks need
# benchmark hardware, and the dedicated x86-16c-32gb runner has to stay free
# for ranked jobs.
#
# RUSTFLAGS pin the same portability floor the committed trusted verifier is
# built with (see benchmark-tools/build-trusted-verifier.sh): AVX2 via
# x86-64-v3, plus the carry-less-multiply extensions that x86-64-v3 does not
# imply. It is a fixed target rather than the harness's `-C target-cpu=native`
# because a hosted runner's CPU model varies between runs, and a lint gate that
# type-checks a different set of `cfg(target_feature)` kernels from one run to
# the next is not a gate.

name: Lint

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  rust:
    name: Formatting & Clippy (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C target-cpu=x86-64-v3 -C target-feature=+pclmulqdq,+aes"
      RUSTUP_TOOLCHAIN: "1.97.0"
    steps:
      - name: Checkout sources
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "${RUSTUP_TOOLCHAIN}" --profile minimal \
            --component rustfmt --component clippy
          rustc --version
          cargo fmt --version
          cargo clippy --version

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --release --workspace --all-targets -- -D warnings

  repo:
    name: Shell & JSON
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Validate files
        run: |
          shopt -s nullglob
          scripts=(
            setup.sh
            benchmark.sh
            benchmark-tools/build-trusted-verifier.sh
            scripts/profile-aggregate.sh
            .github/scripts/*.sh
          )
          bash -n "${scripts[@]}"
          jq empty benchmark.json
